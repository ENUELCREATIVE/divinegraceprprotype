<!doctype html>
<html lang="en">
<head>
<script src="assets/js/device-route.js"></script>
<meta charset="utf-8">
<title>Portal Login, Divine Grace Schools</title>
<script>window.__resources = window.__resources || {};</script>
<script src="assets/js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0;background:#fff}
.lg *,.lg *::before,.lg *::after{box-sizing:border-box}
.lg h1,.lg p{margin:0}
.lg a{text-decoration:none}
.lg a:focus-visible,.lg button:focus-visible{outline:3px solid #6C8CE0;outline-offset:2px}
.lbl{display:block;margin:0 0 8px;font-weight:600;font-size:14px;color:#0A1F5C}
.fld{display:block;width:100%;height:52px;padding:0 16px;border:1.5px solid #B7C5EA;border-radius:6px;font:500 16px 'Manrope',sans-serif;color:#0A1F5C;background:#fff;outline:none}
.fld::placeholder{color:#5F6F9E}
.fld:focus{border-color:#00379B;box-shadow:0 0 0 3px rgba(0,55,155,.18)}
.pbtn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border:0;border-radius:6px;background:#00379B;color:#fff;font:700 16px 'Manrope',sans-serif;cursor:pointer}
.pbtn:hover{background:#002A7A}
.lnk{color:#00379B;font-weight:600}
.lnk:hover{text-decoration:underline}
.tgl{position:absolute;right:4px;top:4px;height:44px;width:44px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:#00379B;font:700 13px 'Manrope',sans-serif;cursor:pointer}
.back{position:absolute;z-index:5;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px 0 14px;border-radius:99px;background:#fff;color:#00379B!important;font:700 14px 'Manrope',sans-serif;box-shadow:0 6px 18px rgba(6,31,99,.28)}
.back:hover{background:#EAF0FF}
</style>
</helmet>
<div class="lg" style="position:relative;width:100%;height:810px;overflow:hidden;font-family:'Manrope',system-ui,sans-serif;color:#1F2F66;background:#A9BBE3 repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.28) 14px 16px)">

<img src="assets/images/login-campus.jpg" alt="Aerial view of Divine Grace Schools campus" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,31,99,.45) 0%,rgba(6,31,99,.62) 100%)"></div>

<a class="back" href="index.html" style="top:24px;left:28px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>Back to Website</a>
<main style="position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:24px">
<section aria-labelledby="login-title" style="width:100%;max-width:440px;background:#fff;border-radius:12px;padding:44px 40px 36px;box-shadow:0 24px 60px rgba(6,31,99,.35)">
<a href="index.html" aria-label="Divine Grace Schools, home" style="display:flex;justify-content:center"><img src="assets/images/school-logo.jpg" alt="Divine Grace Schools official logo" style="display:block;width:88px;height:88px;object-fit:contain"></a>
<h1 id="login-title" style="margin-top:16px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em;color:#0A1F5C">Portal Login</h1>
<p style="margin-top:8px;text-align:center;font-size:15px;line-height:1.6;color:#4A5A8A">Sign in with your Portal ID and password.</p>

<form onSubmit="{{dgsLoginSubmit}}" style="margin-top:28px">
<div>
<label class="lbl" for="portal-id">Portal ID</label>
<input class="fld" id="portal-id" name="portalId" type="text" autocomplete="username" placeholder="Enter your Portal ID">
</div>
<div style="margin-top:20px">
<label class="lbl" for="portal-pw">Password</label>
<div style="position:relative">
<input class="fld" id="portal-pw" name="password" type="{{pwType}}" autocomplete="current-password" placeholder="Enter your password" style="padding-right:52px">
<button type="button" class="tgl" onClick="{{togglePw}}" aria-pressed="{{pwPressed}}" aria-label="{{pwLabel}}" title="{{pwLabel}}"><svg class="eye on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:{{eyeShow}}"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:{{eyeHide}}"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg></button>
</div>
</div>
<div style="margin-top:12px;display:flex;justify-content:flex-end"><a class="lnk" href="#" onClick="{{dgsForgot}}" style="font-size:14px">Forgot Password?</a></div>
<button type="button" class="pbtn" style="margin-top:24px" onClick="{{dgsLogin}}">Login</button>
</form>

<p style="margin-top:28px;padding-top:24px;border-top:1px solid #D3DCF2;text-align:center;font-size:15px;color:#4A5A8A">Need help? <a class="lnk" href="contact.html">Contact the ICT Officer</a></p>
</section>
</main>
<div role="status" aria-live="polite" style="display:{{dgsToastDisp}};position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:300;max-width:min(92vw,520px);padding:12px 18px;border-radius:10px;background:#0A1F5C;color:#fff;font:600 14px/1.45 'Manrope',system-ui,sans-serif;box-shadow:0 12px 32px rgba(6,31,99,.35);text-align:center">{{dgsToast}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { show: false }; }
renderVals() { return Object.assign(this.__base(), this.protoVals()); }

toastMsg(msg, ms) {
  this.setState({ __toast: msg });
  const id = (this.__tid = (this.__tid || 0) + 1);
  window.setTimeout(() => { if (this.__tid === id) { this.setState({ __toast: "" }); } }, ms || 3200);
}
protoVals() {
  const st = this.state || {};
  return {
    dgsToast: st.__toast || "", dgsToastDisp: st.__toast ? "block" : "none",
    dgsLogin: (e) => {
      if (e && e.preventDefault) { e.preventDefault(); }
      const idEl = document.getElementById("portal-id"); const pwEl = document.getElementById("portal-pw");
      const id = ((idEl && idEl.value) || "").trim(); const pw = (pwEl && pwEl.value) || "";
      if (!id || !pw) { this.toastMsg("Enter your Portal ID and password."); return; }
      const cfg = window.DGS_SITE_CONFIG || {};
      if (cfg.portalUrl) { window.location.href = cfg.portalUrl; return; }
      this.toastMsg("Sign-in is not connected yet. Set the portal address in assets/js/site-config.js.", 5000);
    },
    dgsLoginSubmit: (e) => { if (e && e.preventDefault) { e.preventDefault(); } this.protoVals().dgsLogin(e); },
    dgsForgot: (e) => { if (e && e.preventDefault) { e.preventDefault(); } this.toastMsg("Passwords are reset by the ICT Officer. Please contact ICT to reset yours."); }
  };
}

__base() {
  const s = this.state.show;
  return {
    pwType: s ? "text" : "password",
    pwLabel: s ? "Hide password" : "Show password", eyeShow: s ? "none" : "block", eyeHide: s ? "block" : "none",
    pwPressed: s ? "true" : "false",
    togglePw: () => this.setState({ show: !this.state.show }),
    prevent: (e) => { if (e && e.preventDefault) { e.preventDefault(); } }
  };
}
}
</script>
<script src="assets/js/site-config.js"></script>
</body>
</html>
